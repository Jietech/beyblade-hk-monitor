<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beyblade HK 到貨監測</title>
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--dim:#8b949e;
    --in:#3fb950;--out:#f85149;--accent:#58a6ff;--warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
  header{padding:20px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  h1{margin:0;font-size:20px}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  input,select{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:8px 10px;border-radius:6px;font-size:13px}
  input{flex:1;min-width:180px}
  .stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-bottom:12px}
  .stats b{color:var(--fg)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:12px;background:#12171d}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .in{background:rgba(63,185,80,.15);color:var(--in)}
  .out{background:rgba(248,81,73,.15);color:var(--out)}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:0 5px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .ev{font-size:12px;padding:7px 0;border-bottom:1px dashed var(--border)}
  .ev:last-child{border-bottom:none}
  h2{font-size:15px;margin:22px 0 8px}
  .empty{color:var(--dim);padding:18px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>🌀 Beyblade HK 到貨監測</h1>
  <div class="sub">實時追蹤香港網店到貨／售罄狀態 · 資料每 15 分鐘更新 · <span id="updated">載入中…</span></div>
</header>

<div class="wrap">
  <div class="bar">
    <input id="q" placeholder="搜尋商品 / SKU…">
    <select id="tag"><option value="">全部系列</option><option>BX</option><option>UX</option><option>CX</option><option>BURST</option><option>METAL</option><option>OTHER</option></select>
    <select id="store"><option value="">全部商店</option></select>
    <select id="status"><option value="">全部狀態</option><option value="in">有貨</option><option value="out">售罄/截訂</option></select>
  </div>

  <div class="stats">
    <span>商品總數 <b id="c-total">0</b></span>
    <span>有貨 <b id="c-in" style="color:var(--in)">0</b></span>
    <span>售罄 <b id="c-out" style="color:var(--out)">0</b></span>
    <span>商店 <b id="c-store">0</b></span>
  </div>

  <table>
    <thead><tr><th>狀態</th><th>商品</th><th>系列</th><th>價格</th><th>商店</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="empty">載入中…</td></tr></tbody>
  </table>

  <h2>🕒 變化紀錄 (History)</h2>
  <div id="events" class="empty">暫無紀錄</div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let ITEMS = [];

function tagOf(name){
  const s=(name||'').toUpperCase();
  if(/\bCX[- ]?\d|\bCX\b/.test(s))return'CX';
  if(/\bUX[- ]?\d|\bUX\b/.test(s))return'UX';
  if(/\bBX[- ]?\d|\bBX\b/.test(s))return'BX';
  if(/BURST/.test(s))return'BURST';
  if(/METAL/.test(s))return'METAL';
  return'OTHER';
}
const fmtTime=(ts)=>{const d=new Date(ts);return d.toLocaleString('zh-HK',{hour12:false})};

function render(){
  const q=$('#q').value.toLowerCase(),tag=$('#tag').value,store=$('#store').value,st=$('#status').value;
  const rows=ITEMS.filter(i=>
    (!q||i.name.toLowerCase().includes(q)||i.sku.toLowerCase().includes(q))&&
    (!tag||tagOf(i.name)===tag)&&(!store||i.store===store)&&(!st||i.status===st));
  $('#rows').innerHTML = rows.length ? rows.map(i=>`<tr>
    <td><span class="pill ${i.status}">${i.status==='in'?'有貨':'售罄'}</span></td>
    <td>${i.url?`<a href="${i.url}" target="_blank" rel="noopener">${i.name||i.sku}</a>`:(i.name||i.sku)}</td>
    <td><span class="tag">${tagOf(i.name)}</span></td>
    <td>${i.price!=null?'$'+i.price:'—'}</td>
    <td>${i.store}</td></tr>`).join('') : `<tr><td colspan="5" class="empty">沒有符合的商品</td></tr>`;
}

async function load(){
  try{
    const s=await(await fetch('data/state.json?'+Date.now())).json();
    ITEMS=Object.values(s.items||{});
    $('#updated').textContent='更新於 '+fmtTime(s.updatedAt);
    $('#c-total').textContent=ITEMS.length;
    $('#c-in').textContent=ITEMS.filter(i=>i.status==='in').length;
    $('#c-out').textContent=ITEMS.filter(i=>i.status==='out').length;
    const stores=[...new Set(ITEMS.map(i=>i.store))];
    $('#c-store').textContent=stores.length;
    $('#store').innerHTML='<option value="">全部商店</option>'+stores.map(s=>`<option>${s}</option>`).join('');
    if(!ITEMS.length){$('#rows').innerHTML='<tr><td colspan="5" class="empty">尚未有資料 — poller 首次執行後會出現</td></tr>';}
    render();
  }catch(e){$('#rows').innerHTML='<tr><td colspan="5" class="empty">載入失敗：'+e.message+'</td></tr>';}
  try{
    const ev=await(await fetch('data/events.json?'+Date.now())).json();
    const list=(ev.events||[]).slice(0,50);
    const label={restock:'🟢 返貨',oos:'🔴 售罄',new:'✨ 新品',price:'💲 改價'};
    $('#events').innerHTML=list.length?list.map(e=>
      `<div class="ev">${label[e.type]||e.type} · <b>${e.name||e.sku}</b> · ${e.store}
       ${e.type==='price'?` · $${e.from} → $${e.to}`:''}
       <span style="color:var(--dim)"> · ${fmtTime(e.ts)}</span></div>`).join(''):'暫無紀錄';
  }catch{}
}
['q','tag','store','status'].forEach(id=>$('#'+id).addEventListener('input',render));
load();
setInterval(load,60000);
</script>
</body>
</html>
